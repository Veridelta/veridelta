# Veridelta for GitLab CI.
#
# Include it from a release tag, so the template and the package it installs
# are the same version:
#
#   include:
#     - remote: https://raw.githubusercontent.com/Veridelta/veridelta/v0.19.10/ci/gitlab/veridelta.yml
#       inputs:
#         config: veridelta.yaml
#
# Set VERIDELTA_GITLAB_TOKEN (a project access token with the `api` scope) as a
# masked CI/CD variable to keep one summary note up to date on merge requests.
spec:
  inputs:
    config:
      description: Path to the Veridelta YAML configuration, relative to working-directory.
      default: veridelta.yaml
    working-directory:
      description: Directory the comparison runs in. Relative paths in the configuration resolve from here.
      default: "."
    version:
      description: Veridelta version to install from PyPI.
      default: "0.19.10" # veridelta-version: bumped with each release
    extras:
      description: Comma-separated optional extras, such as "snowflake" or "database,fuzzy".
      default: ""
    python-version:
      description: Python version to run Veridelta with, such as "3.13", which uv downloads when the image lacks it. Empty runs the image's Python.
      default: ""
    stage:
      description: Pipeline stage the job runs in.
      default: test
    job-name:
      description: Name of the job.
      default: veridelta
    image:
      description: Image with uv and Python.
      default: ghcr.io/astral-sh/uv:python3.12-bookworm
    html-max-rows:
      description: Rows to embed per table in the HTML report.
      type: number
      default: 1000
    markdown-max-rows:
      description: Changed values to list in the Markdown summary, which reaches the job log and the merge request note. 0 lists none.
      type: number
      default: 0
    otel-send:
      description: Also send the run's OpenTelemetry metrics to the OTLP/HTTP endpoint that the OTEL_EXPORTER_OTLP_* variables set. A send that fails is an error.
      type: boolean
      default: false
    fail-on-mismatch:
      description: Fail the job when the comparison finds drift. An error always fails it.
      type: boolean
      default: true
    comment:
      description: Keep one summary note up to date on the merge request, when VERIDELTA_GITLAB_TOKEN is set.
      type: boolean
      default: true
    upload-artifact:
      description: Keep the JSON summary, Markdown summary, HTML report, and OpenTelemetry metrics as job artifacts.
      type: boolean
      default: true
---
"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  # Inputs reach the script as variables, never by interpolation into it.
  variables:
    VERIDELTA_CONFIG: "$[[ inputs.config ]]"
    VERIDELTA_WORKING_DIRECTORY: "$[[ inputs.working-directory ]]"
    VERIDELTA_VERSION: "$[[ inputs.version ]]"
    VERIDELTA_EXTRAS: "$[[ inputs.extras ]]"
    VERIDELTA_PYTHON_VERSION: "$[[ inputs.python-version ]]"
    VERIDELTA_HTML_MAX_ROWS: "$[[ inputs.html-max-rows ]]"
    VERIDELTA_MARKDOWN_MAX_ROWS: "$[[ inputs.markdown-max-rows ]]"
    VERIDELTA_OTEL_SEND: "$[[ inputs.otel-send ]]"
    VERIDELTA_FAIL_ON_MISMATCH: "$[[ inputs.fail-on-mismatch ]]"
    VERIDELTA_COMMENT: "$[[ inputs.comment ]]"
    VERIDELTA_UPLOAD_ARTIFACT: "$[[ inputs.upload-artifact ]]"
  script:
    - |
      set +e
      # Reports land where the artifacts are collected only when they are kept.
      if [ "$VERIDELTA_UPLOAD_ARTIFACT" = "true" ]; then
        report="$CI_PROJECT_DIR/veridelta-report"
      else
        report=$(mktemp -d)
      fi
      mkdir -p "$report"
      extras=$(printf '%s' "$VERIDELTA_EXTRAS" | tr -d ' ')
      spec="veridelta${extras:+[$extras]}==$VERIDELTA_VERSION"
      # Left unquoted in the command, so an empty value adds no argument.
      send=""
      if [ "$VERIDELTA_OTEL_SEND" = "true" ]; then send="--otel-send"; fi
      # The cd runs in a subshell, so the rest of the script stays in the project
      # directory, and a directory that does not exist reads as an error. An empty
      # python-version adds no --python, so the image's Python runs.
      (cd "$VERIDELTA_WORKING_DIRECTORY" && uvx ${VERIDELTA_PYTHON_VERSION:+--python "$VERIDELTA_PYTHON_VERSION"} --from "$spec" veridelta run -c "$VERIDELTA_CONFIG" --json --html "$report/report.html" --html-max-rows "$VERIDELTA_HTML_MAX_ROWS" --markdown "$report/summary.md" --markdown-max-rows "$VERIDELTA_MARKDOWN_MAX_ROWS" --otel "$report/otel-metrics.json" $send > "$report/summary.json")
      code=$?
      # A pinned older release exits 1 on a failure too, so 1 is drift only
      # when the summary says so. Any other code, such as 3, is an error.
      if [ "$code" -eq 0 ]; then
        status=match
      elif [ "$code" -eq 1 ] && grep -q '"is_match": false' "$report/summary.json"; then
        status=drift
      else
        status=error
      fi
      echo "Veridelta: $status (exit code $code)"
      if [ -s "$report/summary.md" ]; then cat "$report/summary.md"; fi
      if [ "$VERIDELTA_COMMENT" = "true" ] && [ -n "${VERIDELTA_GITLAB_TOKEN:-}" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        VERIDELTA_REPORT="$report" python3 - <<'PY' || echo "Veridelta could not post the merge request note; check that VERIDELTA_GITLAB_TOKEN has the api scope."
      import json
      import os
      import urllib.parse
      import urllib.request

      api = os.environ["CI_API_V4_URL"]
      notes_url = (
          f"{api}/projects/{os.environ['CI_PROJECT_ID']}"
          f"/merge_requests/{os.environ['CI_MERGE_REQUEST_IID']}/notes"
      )
      headers = {"PRIVATE-TOKEN": os.environ["VERIDELTA_GITLAB_TOKEN"], "Content-Type": "application/json"}


      def call(method, url, payload=None):
          data = None if payload is None else json.dumps(payload).encode()
          request = urllib.request.Request(url, data=data, headers=headers, method=method)
          with urllib.request.urlopen(request) as response:
              return json.load(response)


      marker = "<!-- veridelta:" + urllib.parse.quote(os.environ["VERIDELTA_CONFIG"], safe="") + " -->"
      try:
          with open(os.path.join(os.environ["VERIDELTA_REPORT"], "summary.md"), encoding="utf-8") as handle:
              summary = handle.read()
      except OSError:
          summary = "### Veridelta: ERROR\n\n`veridelta run` did not write a summary. The job log has the error.\n"
      body = marker + "\n" + summary
      me = call("GET", f"{api}/user")["id"]
      notes = call("GET", f"{notes_url}?per_page=100&sort=desc")
      # Only this token's own note is updated, so a quoted marker cannot redirect it.
      mine = next((n for n in notes if n["author"]["id"] == me and n["body"].startswith(marker)), None)
      if mine is None:
          call("POST", notes_url, {"body": body})
      else:
          call("PUT", f"{notes_url}/{mine['id']}", {"body": body})
      PY
      fi
      if [ "$status" = error ]; then exit 1; fi
      if [ "$status" = drift ] && [ "$VERIDELTA_FAIL_ON_MISMATCH" = "true" ]; then exit 1; fi
      exit 0
  artifacts:
    when: always
    expose_as: Veridelta report
    paths:
      - veridelta-report/
