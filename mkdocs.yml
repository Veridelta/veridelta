site_name: Veridelta
site_description: Compare two datasets on their primary keys under rules you declare, on a laptop, in CI, or inside a warehouse.
site_author: Veridelta Maintainers
site_url: https://veridelta.github.io/veridelta/
repo_url: https://github.com/Veridelta/veridelta
repo_name: Veridelta/veridelta

theme:
  name: material
  # The link preview tags, in overrides/main.html.
  custom_dir: overrides
  # The logo's symbol, from the files the link preview card shows.
  logo: assets/veridelta-symbol.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter
  # Opt-in: a page that uses a macro sets `render_macros: true`. Notebooks and
  # pages quoting GitHub's `${{ }}` expressions are never read as templates.
  - macros:
      render_by_default: false
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

# Writes llms.txt and llms-full.txt into the site, for language models.
hooks:
  - hooks/llms_txt.py

extra:
  version: 0.27.1

# The logo's colors, then accessibility fixes over the Material theme. Each file
# says what it changes.
extra_css:
  - stylesheets/brand.css
  - stylesheets/accessibility.css
extra_javascript:
  - javascripts/accessibility.js

# A link to a heading that does not exist fails `mkdocs build --strict`.
validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  # Markdown inside the <details> blocks that hold the recordings.
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Tutorials:
    - 1. Core concepts: examples/01_core_concepts.ipynb
    - 2. YAML and CLI: examples/02_yaml_and_cli.ipynb
    - 3. Advanced rules: examples/03_advanced_rules.ipynb
    - 4. HTML reports: examples/04_html_reports.ipynb
    - 5. Validate and CI: examples/05_validate_and_ci.ipynb
    - 6. Model evaluation runs: examples/06_model_evaluation_runs.ipynb
  - User guide:
    - Configuration: configuration.md
    - Sources: sources.md
    - Rules: rules.md
    - Pushdown: pushdown.md
    - Results: results.md
    - Command line: cli.md
    - CI integrations: ci.md
    - AI agents: agents.md
  - API reference: api.md
  - Roadmap: roadmap.md
