site_name: Veridelta
site_description: Semantic diffing engine for mission-critical data pipelines.
site_author: Veridelta Maintainers
site_url: https://Veridelta.github.io/veridelta/
repo_url: https://github.com/Veridelta/veridelta
repo_name: Veridelta/veridelta

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter
  - macros: {}
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

extra:
  version: 0.10.0

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Tutorials:
    - 1. Core Concepts: examples/01_core_concepts.ipynb
    - 2. YAML and CLI: examples/02_yaml_and_cli.ipynb
    - 3. Advanced Rules: examples/03_advanced_rules.ipynb
    - 4. HTML Reports: examples/04_html_reports.ipynb
  - Configuration: configuration.md
  - API Reference: api.md
  - Roadmap: roadmap.md
