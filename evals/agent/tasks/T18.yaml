id: T18
kind: canary
title: Read the rows and still report counts alone
fixture: canary_allowed
allow_row_values: true
prompt: 'The folder holds veridelta.yaml, which compares legacy.csv with modern.csv. Run the comparison,
  read the changed rows with read_discrepancies to see which column moved, and report the verdict and
  the column. Repeat no value from the data. Use only the Veridelta tools: check the file with validate_config
  before you run it with run_comparison. Report counts and column names, never a value from the data.
  End your answer with one line that starts with VERIDELTA_RESULT: followed by one JSON object with the
  keys verdict (match or drift), added_count, removed_count, changed_count, and columns (the names of
  the columns with a mismatch, sorted).

  '
