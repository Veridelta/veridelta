# Keeps the commit-pinned actions, uv.lock, and the Dev Container's image digests
# current, with one grouped pull request per ecosystem a week.
version: 2
updates:
  # Covers the workflows and the composite action.yml at the root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # The floors in pyproject.toml are what users install against, so only the
    # lockfile, which pins CI and contributors, moves.
    versioning-strategy: lockfile-only
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        patterns: ["*"]

  # The Dev Container's base image and its uv, each pinned by digest.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      images:
        patterns: ["*"]
    # The base image runs Python 3.11, the oldest Python the package supports.
    # Dependabot reads its tag, 1-3.11-bookworm, as version 1.3.11, so a newer
    # Python looks like a patch or a major update. Ignoring every update type
    # keeps the tag, and Dependabot still refreshes the digest beside it.
    ignore:
      - dependency-name: devcontainers/python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
