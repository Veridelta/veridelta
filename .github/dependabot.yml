# Keeps the commit-pinned actions and uv.lock current, with one grouped pull
# request per ecosystem a week.
version: 2
updates:
  # Covers the workflows and the composite action.yml at the root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # The floors in pyproject.toml are what users install against, so only the
    # lockfile, which pins CI and contributors, moves.
    versioning-strategy: lockfile-only
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        patterns: ["*"]
