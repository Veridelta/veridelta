name: Documentation
description: Report a page or docstring that is wrong, unclear, or missing.
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: The page URL, or the name of the function or class.
      placeholder: https://veridelta.github.io/veridelta/configuration/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the documentation says, and what is wrong or missing.
    validations:
      required: true
