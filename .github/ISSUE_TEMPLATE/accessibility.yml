name: Accessibility barrier
description: Report something that keeps you from reading or using Veridelta, its docs, or its reports.
labels: ["accessibility", "bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Share only what you are comfortable sharing. A partial report helps, and you
        never need to disclose a disability or a diagnosis. The
        [accessibility statement](https://github.com/Veridelta/veridelta/blob/main/ACCESSIBILITY.md)
        lists the barriers we already know of.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      description: The part of Veridelta where you met the barrier.
      options:
        - Documentation site
        - HTML report
        - Command-line output
        - Markdown summary on a pull or merge request
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or command
      description: The page URL, or the command you ran.
      placeholder: https://veridelta.github.io/veridelta/cli/
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: >-
        How much the barrier affects you. Triage confirms or adjusts it, and the
        accessibility statement defines each level.
      options:
        - Critical
        - Serious
        - Moderate
        - Minor
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your operating system, and your browser or terminal, with versions.
      placeholder: "Windows 11, Firefox 131"
  - type: input
    id: assistive-technology
    attributes:
      label: Assistive technology
      description: Any screen reader, magnifier, voice control, or other tool you used, with its version.
      placeholder: NVDA 2024.4
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Optional. Paste or drag in a file, or link to one.
