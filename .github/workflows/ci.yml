name: CI Pipeline

on:
  push:
    branches: ["main"]
  # Every base branch, so a PR stacked on another PR is checked before it lands.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs install and run third-party packages, so the token can only read the code.
permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint, Format, and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup

      - name: Run Pre-commit Hooks
        run: uv run pre-commit run --all-files

      - name: Run Pyright
        run: uv run pyright src/

  # A push to main builds the site in the docs workflow, which deploys it, so this
  # builds it only for a pull request, and the site is built once per push.
  docs:
    name: Documentation Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup

      - name: Build MkDocs Site
        run: uv run mkdocs build --strict

  test-smoke:
    name: Smoke Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup

      - name: Execute Smoke Tests
        run: uv run pytest tests/smoke --no-cov

  test-package:
    name: Package
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv and Python
        uses: ./.github/actions/setup
        with:
          sync: "false"

      # uv builds the sdist, then the wheel from the unpacked sdist, so a file
      # the sdist leaves out breaks the wheel here rather than on PyPI.
      - name: Build the Sdist and the Wheel
        run: uv build

      # The dependencies come at their locked versions, so a new upstream
      # release cannot fail a pull request in this job.
      - name: Install the Wheel Alone
        run: |
          set -euo pipefail
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" --requirements "$RUNNER_TEMP/requirements.txt" dist/veridelta-*.whl

      - name: Run the Installed Package
        working-directory: demo
        env:
          WHEEL_ENV: ${{ runner.temp }}/wheel
        run: |
          set -euo pipefail
          "$WHEEL_ENV/bin/veridelta" --version
          # Every module imports without an extra, and the typing marker ships.
          "$WHEEL_ENV/bin/python" - <<'EOF'
          import importlib
          import importlib.resources
          import pkgutil

          import veridelta

          assert "site-packages" in veridelta.__file__, veridelta.__file__
          for module in pkgutil.walk_packages(veridelta.__path__, "veridelta."):
              importlib.import_module(module.name)
          assert importlib.resources.files("veridelta").joinpath("py.typed").is_file()
          EOF
          # The quick start's two files differ on purpose, so a working install exits 1.
          status=0
          "$WHEEL_ENV/bin/veridelta" run -c veridelta.yaml --html "$RUNNER_TEMP/report.html" --markdown "$RUNNER_TEMP/summary.md" || status=$?
          test "$status" -eq 1
          test -s "$RUNNER_TEMP/report.html"
          test -s "$RUNNER_TEMP/summary.md"

  test-core:
    name: Core Engine (Py ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false # Continue running matrix jobs to identify all failing OS/Python combinations
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Linux runs every supported Python. macOS and Windows run the oldest and
        # the newest, so a platform difference still shows up on each, in 8 jobs
        # rather than 12.
        exclude:
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
        # One job measures coverage, gates the core modules on it, and uploads it.
        # The rest skip the tracing, which slows the suite.
        include:
          - { os: ubuntu-latest, python-version: "3.12", coverage: true }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Execute Core Tests (Unit & Integration)
        if: matrix.coverage
        run: uv run pytest tests/unit tests/integration

      - name: Execute Core Tests Without Coverage
        if: ${{ !matrix.coverage }}
        run: uv run pytest tests/unit tests/integration --no-cov

      - name: Gate core-module branch coverage
        if: matrix.coverage
        run: uv run coverage report --include='src/veridelta/engine.py,src/veridelta/_resolution.py,src/veridelta/_suggest.py,src/veridelta/_matching.py,src/veridelta/_reading.py,src/veridelta/_warehouses.py,src/veridelta/_results.py,src/veridelta/_pushdown.py,src/veridelta/_checks.py,src/veridelta/_value_maps.py,src/veridelta/models.py,src/veridelta/sentinels.py,src/veridelta/telemetry.py,src/veridelta/connectors/sql.py,src/veridelta/connectors/warehouse.py,src/veridelta/connectors/lakehouse.py,src/veridelta/connectors/database.py,src/veridelta/connectors/duckdb.py,src/veridelta/mcp_server.py' --fail-under=100

      - name: Upload Coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  test-e2e:
    name: CLI End-to-End (${{ matrix.os }})
    needs: test-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Execute E2E CLI Subprocess Tests
        run: uv run pytest tests/e2e --no-cov

  test-notebooks:
    name: Tutorial Notebooks
    needs: test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup

      - name: Execute Notebooks and Check Recorded Output
        run: uv run pytest tests/notebooks --no-cov

  test-postgres:
    name: Postgres Pushdown Parity
    needs: test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERIDELTA_POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup

      # The live warehouse backends share one harness. A DuckDB file stands in
      # for MotherDuck, so the harness runs on every pull request with no account.
      - name: Run the Parity Suite Through the Warehouse Harness
        env:
          VERIDELTA_PARITY_BACKEND: motherduck
          MOTHERDUCK_DATABASE: ${{ runner.temp }}/live.duckdb
        run: make live

      - name: Run the Parity Suite Inside Postgres
        run: make postgres

  test-databases:
    name: Database Servers
    needs: test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Both passwords hold @, :, / and #, so every read checks that the
      # password Veridelta percent-encodes reaches each driver intact.
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: "Vd@pass:w/rd#1"
          MYSQL_DATABASE: veridelta
        ports:
          - 3306:3306
        # `mysqladmin ping` succeeds once the server accepts connections,
        # even one it refuses to sign in.
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Vd@pass:w/rd#1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      VERIDELTA_MYSQL_URI: mysql://root:Vd%40pass%3Aw%2Frd%231@127.0.0.1:3306/veridelta
      # The container's certificate is self-signed, so TLS skips its check.
      VERIDELTA_MSSQL_URI: mssql://sa:Vd%40pass%3Aw%2Frd%231@127.0.0.1:1433/master?encrypt=true&trust_server_certificate=true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup
        with:
          group: databases

      - name: Read Real MySQL and SQL Server Tables
        run: make databases

  test-accessibility:
    name: Accessibility
    needs: test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv, Python, and the Dependencies
        uses: ./.github/actions/setup
        with:
          group: accessibility

      # Playwright's Chromium is cached under its Playwright version, so a run
      # downloads it only after the lockfile moves Playwright. The runner image
      # already holds the libraries Chromium needs, the ones Google Chrome needs.
      - name: Read Playwright's Version
        id: playwright
        run: echo "version=$(uv run --group accessibility python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` runs apt-get update, which can stall on the Ubuntu archive
      # until the job's limit cancels it. Each try gets four minutes, and a
      # second one follows a try that stalled or failed.
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2; do
            timeout --kill-after=10 240 uv run --group accessibility playwright install --with-deps chromium && exit 0
            echo "Installing Chromium failed or stalled on try $attempt."
          done
          exit 1

      # axe-core on every docs page and a sample report, then the report by keyboard.
      - name: Check the Docs Site and the HTML Report
        run: make accessibility

  action:
    name: GitHub Action (${{ matrix.os }})
    needs: test-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `uses: ./` installs Veridelta from this checkout, as a consumer's
      # `uses: Veridelta/veridelta@vX.Y.Z` installs that tag.
      - name: Compare matching data
        id: match
        uses: ./
        with:
          config: tests/fixtures/ci/match.yaml
          comment: "false"
          artifact-name: veridelta-match-${{ matrix.os }}

      - name: Compare drifting data
        id: drift
        uses: ./
        with:
          config: tests/fixtures/ci/drift.yaml
          comment: "false"
          fail-on-mismatch: "false"
          markdown-max-rows: "5"
          artifact-name: veridelta-drift-${{ matrix.os }}

      # The same configuration again, with its drift accepted. It runs before the
      # checks read the drift run's reports, which it must leave alone.
      - name: Accept the drift with a baseline
        id: accepted
        uses: ./
        with:
          config: tests/fixtures/ci/drift.yaml
          baseline: tests/fixtures/ci/accepted.json
          comment: "false"
          artifact-name: veridelta-accepted-${{ matrix.os }}

      - name: Run a configuration that cannot finish
        id: broken
        uses: ./
        continue-on-error: true
        with:
          config: tests/fixtures/ci/broken.yaml
          comment: "false"
          upload-artifact: "false"

      - name: Check the action's outputs
        shell: bash
        env:
          MATCH_STATUS: ${{ steps.match.outputs.status }}
          MATCH_IS_MATCH: ${{ steps.match.outputs.is-match }}
          MATCH_EXIT_CODE: ${{ steps.match.outputs.exit-code }}
          DRIFT_STATUS: ${{ steps.drift.outputs.status }}
          DRIFT_IS_MATCH: ${{ steps.drift.outputs.is-match }}
          DRIFT_EXIT_CODE: ${{ steps.drift.outputs.exit-code }}
          DRIFT_SUMMARY: ${{ steps.drift.outputs.summary-markdown }}
          DRIFT_OTEL: ${{ steps.drift.outputs.otel-metrics }}
          ACCEPTED_STATUS: ${{ steps.accepted.outputs.status }}
          ACCEPTED_EXIT_CODE: ${{ steps.accepted.outputs.exit-code }}
          ACCEPTED_SUMMARY: ${{ steps.accepted.outputs.summary-markdown }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          BROKEN_STATUS: ${{ steps.broken.outputs.status }}
          BROKEN_EXIT_CODE: ${{ steps.broken.outputs.exit-code }}
          BROKEN_OTEL: ${{ steps.broken.outputs.otel-metrics }}
        run: |
          set -x
          test "$MATCH_STATUS" = match
          test "$MATCH_IS_MATCH" = true
          test "$MATCH_EXIT_CODE" = 0
          test "$DRIFT_STATUS" = drift
          test "$DRIFT_IS_MATCH" = false
          test "$DRIFT_EXIT_CODE" = 1
          grep -q "### Veridelta: FAILED" "$DRIFT_SUMMARY"
          grep -q "| \`2\` | \`status\` | \`'closed'\` | \`'shipped'\` |" "$DRIFT_SUMMARY"
          grep -q '"name":"veridelta.diff.match"' "$DRIFT_OTEL"
          test "$(wc -l < "$DRIFT_OTEL")" -eq 1
          test "$ACCEPTED_STATUS" = match
          test "$ACCEPTED_EXIT_CODE" = 0
          grep -q "| Accepted by the baseline | 3 |" "$ACCEPTED_SUMMARY"
          test "$BROKEN_OUTCOME" = failure
          test "$BROKEN_STATUS" = error
          test "$BROKEN_EXIT_CODE" = 3
          test -z "$BROKEN_OTEL"

  # Rulesets require this one check rather than each matrix job by name. It
  # needs every job above, runs even after one fails, and passes only when each
  # one succeeded, so a cancelled or skipped job fails it too. The one exception
  # is the docs job, skipped by design on a push. It never takes a condition
  # that could skip it, since a skipped required check reads as passing.
  ci-passed:
    name: CI Passed
    if: always()
    needs: [static-analysis, docs, test-smoke, test-package, test-core, test-e2e, test-notebooks, test-postgres, test-databases, test-accessibility, action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Every Job to Pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg event "$EVENT" 'to_entries | all(
            .value.result == "success"
            or (.key == "docs" and $event == "push" and .value.result == "skipped")
          )' > /dev/null
