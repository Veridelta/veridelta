name: CI Pipeline

on:
  push:
    branches: ["main"]
  # Every base branch, so a PR stacked on another PR is checked before it lands.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs install and run third-party packages, so the token can only read the code.
permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint, Format, and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run Pre-commit Hooks
        run: uv run pre-commit run --all-files

      - name: Run Pyright
        run: uv run pyright src/

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Build MkDocs Site
        run: uv run mkdocs build --strict

  test-smoke:
    name: Smoke Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Execute Smoke Tests
        run: uv run pytest tests/smoke --no-cov

  test-core:
    name: Core Engine (Py ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false # Continue running matrix jobs to identify all failing OS/Python combinations
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Execute Core Tests (Unit & Integration)
        run: uv run pytest tests/unit tests/integration

      - name: Gate core-module branch coverage
        run: uv run coverage report --include='src/veridelta/engine.py,src/veridelta/models.py,src/veridelta/sentinels.py,src/veridelta/telemetry.py,src/veridelta/connectors/sql.py,src/veridelta/connectors/warehouse.py,src/veridelta/connectors/lakehouse.py,src/veridelta/connectors/database.py,src/veridelta/connectors/duckdb.py' --fail-under=100

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  test-e2e:
    name: CLI End-to-End (${{ matrix.os }})
    needs: test-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"] 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Execute E2E CLI Subprocess Tests
        run: uv run pytest tests/e2e --no-cov

  test-notebooks:
    name: Tutorial Notebooks
    needs: test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Execute Notebooks and Check Recorded Output
        run: uv run pytest tests/notebooks --no-cov

  test-postgres:
    name: Postgres Pushdown Parity
    needs: test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERIDELTA_POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run the Parity Suite Inside Postgres
        run: make postgres

  test-databases:
    name: Database Servers
    needs: test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Both passwords hold @, :, / and #, so every read checks that the
      # password Veridelta percent-encodes reaches each driver intact.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "Vd@pass:w/rd#1"
          MYSQL_DATABASE: veridelta
        ports:
          - 3306:3306
        # `mysqladmin ping` succeeds once the server accepts connections,
        # even one it refuses to sign in.
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Vd@pass:w/rd#1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      VERIDELTA_MYSQL_URI: mysql://root:Vd%40pass%3Aw%2Frd%231@127.0.0.1:3306/veridelta
      # The container's certificate is self-signed, so TLS skips its check.
      VERIDELTA_MSSQL_URI: mssql://sa:Vd%40pass%3Aw%2Frd%231@127.0.0.1:1433/master?encrypt=true&trust_server_certificate=true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-extras --group databases

      - name: Read Real MySQL and SQL Server Tables
        run: make databases

  action:
    name: GitHub Action (${{ matrix.os }})
    needs: test-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `uses: ./` installs Veridelta from this checkout, as a consumer's
      # `uses: Veridelta/veridelta@vX.Y.Z` installs that tag.
      - name: Compare matching data
        id: match
        uses: ./
        with:
          config: tests/fixtures/ci/match.yaml
          comment: "false"
          artifact-name: veridelta-match-${{ matrix.os }}

      - name: Compare drifting data
        id: drift
        uses: ./
        with:
          config: tests/fixtures/ci/drift.yaml
          comment: "false"
          fail-on-mismatch: "false"
          markdown-max-rows: "5"
          artifact-name: veridelta-drift-${{ matrix.os }}

      - name: Run a configuration that cannot finish
        id: broken
        uses: ./
        continue-on-error: true
        with:
          config: tests/fixtures/ci/broken.yaml
          comment: "false"
          upload-artifact: "false"

      - name: Check the action's outputs
        shell: bash
        env:
          MATCH_STATUS: ${{ steps.match.outputs.status }}
          MATCH_IS_MATCH: ${{ steps.match.outputs.is-match }}
          MATCH_EXIT_CODE: ${{ steps.match.outputs.exit-code }}
          DRIFT_STATUS: ${{ steps.drift.outputs.status }}
          DRIFT_IS_MATCH: ${{ steps.drift.outputs.is-match }}
          DRIFT_EXIT_CODE: ${{ steps.drift.outputs.exit-code }}
          DRIFT_SUMMARY: ${{ steps.drift.outputs.summary-markdown }}
          DRIFT_OTEL: ${{ steps.drift.outputs.otel-metrics }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          BROKEN_OTEL: ${{ steps.broken.outputs.otel-metrics }}
        run: |
          set -x
          test "$MATCH_STATUS" = match
          test "$MATCH_IS_MATCH" = true
          test "$MATCH_EXIT_CODE" = 0
          test "$DRIFT_STATUS" = drift
          test "$DRIFT_IS_MATCH" = false
          test "$DRIFT_EXIT_CODE" = 1
          grep -q "### Veridelta: FAILED" "$DRIFT_SUMMARY"
          grep -q "| \`2\` | \`status\` | \`'closed'\` | \`'shipped'\` |" "$DRIFT_SUMMARY"
          grep -q '"name":"veridelta.diff.match"' "$DRIFT_OTEL"
          test "$(wc -l < "$DRIFT_OTEL")" -eq 1
          test "$BROKEN_OUTCOME" = failure
          test -z "$BROKEN_OTEL"

  # Rulesets require this one check rather than each matrix job by name. It
  # needs every job above, runs even after one fails, and passes only when each
  # one succeeded, so a cancelled or skipped job fails it too. It never takes a
  # condition that could skip it, since a skipped required check reads as passing.
  ci-passed:
    name: CI Passed
    if: always()
    needs: [static-analysis, docs, test-smoke, test-core, test-e2e, test-notebooks, test-postgres, test-databases, action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Every Job to Pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
