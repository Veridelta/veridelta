name: Deploy Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The build installs every package the docs need and runs it, so it gets a
# read-only token. Only the deploy job, which checks out nothing and installs
# nothing, may publish the site. It hands the built site to GitHub Pages, so no
# job can write to the repository. Pages must be set to deploy from GitHub
# Actions, under Settings, Pages, Source.
permissions:
  contents: read

# One deploy at a time: merges that land together queue instead of cancelling
# one another, and the newest commit on main deploys last.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build the Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --locked --all-extras

      - name: Build MkDocs
        run: uv run mkdocs build --strict

      - name: Upload the Site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy the Site to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that this run built it

    steps:
      - name: Deploy the Uploaded Site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
