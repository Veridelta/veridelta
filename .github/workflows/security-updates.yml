name: Security Updates

# Audits uv.lock on main every day for known vulnerabilities. For each package
# with one, it runs `uv lock --upgrade-package` with no version pinned, so a
# release one Python cannot install never forces an old release onto that
# Python, as a pinned Dependabot upgrade can. It then opens one pull request,
# or updates the one it opened before, for a maintainer to review and merge.
#
# `uv lock` can build a package from source, which runs that package's code, so
# the job that runs it holds a read-only token and no secret. The job that opens
# the pull request checks nothing out and installs nothing; it writes the new
# lockfile through the GitHub API with SECURITY_UPDATES_TOKEN, a token with
# write access to contents and pull requests. A pull request opened with the
# workflow's own token would start no CI.
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-updates

jobs:
  upgrade:
    name: Upgrade the Vulnerable Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.upgrade.outputs.changed }}
      title: ${{ steps.upgrade.outputs.title }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up uv and Python
        uses: ./.github/actions/setup
        with:
          sync: "false"

      - name: Audit the Lockfile
        id: audit
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          # pip-audit exits with 1 when it finds a vulnerability, and writes the
          # report either way. A missing report means the audit itself failed.
          uvx pip-audit@2.10.1 --no-deps --disable-pip --requirement "$RUNNER_TEMP/requirements.txt" \
            --format json --output "$RUNNER_TEMP/audit.json" || test -s "$RUNNER_TEMP/audit.json"
          packages=$(jq -r '[.dependencies[] | select(.vulns | length > 0) | .name] | unique | join(" ")' "$RUNNER_TEMP/audit.json")
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          if [ -z "$packages" ]; then
            echo "No known vulnerability in uv.lock."
          fi

      - name: Upgrade Each Package and Check the Lockfile
        id: upgrade
        if: steps.audit.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.audit.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p fix
          cp uv.lock "$RUNNER_TEMP/base.lock"
          upgrades=()
          for package in $PACKAGES; do
            upgrades+=(--upgrade-package "$package")
          done
          uv lock "${upgrades[@]}"
          if cmp -s uv.lock "$RUNNER_TEMP/base.lock"; then
            echo "::warning::No release fixes ${PACKAGES} for every Python uv.lock covers, so nothing changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/lock_diff.py "$RUNNER_TEMP/base.lock" uv.lock --markdown "$RUNNER_TEMP/changes.md"

          uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/after.txt"
          uvx pip-audit@2.10.1 --no-deps --disable-pip --requirement "$RUNNER_TEMP/after.txt" \
            --format json --output "$RUNNER_TEMP/after.json" || test -s "$RUNNER_TEMP/after.json"

          names=$(sed 's/ /, /g' <<< "$PACKAGES")
          title="fix(deps): upgrade ${names} for known vulnerabilities"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cp uv.lock fix/uv.lock
          {
            echo "## Summary"
            echo
            echo "The daily audit of \`uv.lock\` on main found known vulnerabilities. This runs \`uv lock --upgrade-package\` for each affected package, with no version pinned."
            echo
            echo "| Package | Locked | Advisory | Fixed in |"
            echo "| :--- | :--- | :--- | :--- |"
            jq -r '.dependencies[] | .name as $name | .version as $version | .vulns[]
              | "| \($name) | \($version) | \(.id) | \(.fix_versions | join(", ")) |"' "$RUNNER_TEMP/audit.json"
            echo
            echo "The lockfile changes:"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            left=$(jq -r '.dependencies[] | select(.vulns | length > 0) | .name as $name | .version as $version | .vulns[]
              | "- \($name) \($version): \(.id)"' "$RUNNER_TEMP/after.json")
            if [ -n "$left" ]; then
              echo "These remain after the upgrade, since no release fixes them for every Python \`uv.lock\` covers:"
              echo
              echo "$left"
              echo
            fi
            echo "Maintenance. The Security Updates workflow opened this pull request. A maintainer reviews and merges it."
            echo
            echo "## Checklist"
            echo
            echo "- [x] The title follows [Conventional Commits](https://www.conventionalcommits.org/), such as \`feat: read Avro files\`."
            echo "- [x] The summary names the use case this change serves, such as \`UC-01\` in \`product/USERS.md\`, or says it is maintenance."
            echo "- [ ] \`make all\` passes. CI runs the same checks on this pull request."
            echo "- [x] Tests cover new or changed behavior. No behavior changes."
            echo "- [x] The documentation describes any change a user can see. No change a user can see."
            echo "- [x] \`CHANGELOG.md\` is unchanged. The release pull request writes it."
          } > fix/body.md
          cat fix/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the New Lockfile
        if: steps.upgrade.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-update
          path: |
            fix/uv.lock
            fix/body.md
          if-no-files-found: error
          overwrite: true

  open:
    name: Open the Pull Request
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Holds the only write token. It checks nothing out and installs nothing, so
    # no package the lockfile names runs where the token can be read.
    permissions: {}

    steps:
      - name: Download the New Lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-update
          path: fix/

      - name: Commit the Lockfile and Open or Update the Pull Request
        env:
          GH_TOKEN: ${{ secrets.SECURITY_UPDATES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PARENT: ${{ github.sha }}
          TITLE: ${{ needs.upgrade.outputs.title }}
          BRANCH: security-updates/uv-lock
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the SECURITY_UPDATES_TOKEN secret to a token that can write contents and pull requests, so the pull request starts CI."
            exit 1
          fi
          # The commit's parent is the commit the audit read, so the lockfile
          # never lands on a main that moved since.
          tree=$(gh api "repos/${GH_REPO}/git/commits/${PARENT}" --jq '.tree.sha')
          blob=$(jq -n --rawfile content fix/uv.lock '{content: $content, encoding: "utf-8"}' \
            | gh api "repos/${GH_REPO}/git/blobs" --input - --jq '.sha')
          new_tree=$(jq -n --arg base "$tree" --arg blob "$blob" \
            '{base_tree: $base, tree: [{path: "uv.lock", mode: "100644", type: "blob", sha: $blob}]}' \
            | gh api "repos/${GH_REPO}/git/trees" --input - --jq '.sha')
          commit=$(jq -n --arg message "$TITLE" --arg tree "$new_tree" --arg parent "$PARENT" \
            '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api "repos/${GH_REPO}/git/commits" --input - --jq '.sha')
          if gh api "repos/${GH_REPO}/git/ref/heads/${BRANCH}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/heads/${BRANCH}" -f sha="$commit" -F force=true > /dev/null
          else
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$commit" > /dev/null
          fi
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$TITLE" --body-file fix/body.md
            echo "::notice::Updated pull request #${number}."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file fix/body.md
          fi
