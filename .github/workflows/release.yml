name: Publish to PyPI

# Merging a `chore(release): X.Y.Z` pull request releases X.Y.Z. The push to
# main tags the version when PyPI does not have it yet and starts a run on that
# tag, which builds, publishes once the `pypi` environment approves, and
# creates the GitHub Release, marked Latest when it is the newest version. The
# build runs in a job that cannot publish, and the job that can runs no code
# from the release. A
# merge that lands while that run waits leaves the tag where it is and starts
# nothing. A run that was rejected or cancelled is started again by hand, on the
# tag. A version tag pushed by hand publishes the same way. PyPI's trusted
# publisher is bound to this file's name and to that environment, so rename
# neither without updating PyPI first.

on:
  push:
    branches: ["main"]
    tags:
      # Only a full version tag (e.g., v0.10.0) publishes. GitHub's filter
      # treats `+` as "one or more", so a floating action tag such as `v1`
      # cannot trigger a release by matching a looser `v*`.
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Run on a version tag to retry a release that stopped partway.
  workflow_dispatch:

# Runs for one ref take turns. On main, that keeps two merges from racing to
# make one tag. On a tag, a second run finds the files the first uploaded.
# GitHub cancels a waiting run when a newer one arrives, and the newer run tags
# the version main holds then. So a release is left untagged only if its run
# waits behind another and the next release merges before it starts. Push that
# tag by hand.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag a New Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the version tag
      actions: write # start this workflow on that tag

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the Version When PyPI Lacks It
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v${version}"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 \
            "https://pypi.org/pypi/veridelta/${version}/json")
          case "$status" in
            200) echo "${version} is already on PyPI, so there is nothing to release."; exit 0 ;;
            404) ;;
            *) echo "::error::PyPI answered HTTP ${status} for ${version}."; exit 1 ;;
          esac

          # The last line is the peeled commit of an annotated tag.
          existing=$(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | tail -n 1 | cut -f 1)
          if [ -n "$existing" ]; then
            # The tag's publish run started when the tag was made, so a merge
            # that lands while that run waits for the pypi approval starts
            # nothing here, which would ask for the approval again. A run that
            # was rejected or cancelled is started again by hand, on the tag.
            # The version keeps the tag, so the tag still names what is
            # released, and it is never moved.
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::notice::${tag} is on ${existing}, so that commit is released as ${version}."
            fi
            echo "${tag} exists, so its publish run is not started again."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"

          # A tag pushed with this job's token starts no workflow, but a
          # dispatch does, so start the publishing run on the tag.
          gh workflow run release.yml --ref "$tag"

  build:
    name: Build the Package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      files: ${{ steps.upload.outputs.files }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The uv release CI runs. The build backend is pinned in pyproject.toml.
          version: "0.12.23"
          enable-cache: false
          python-version: "3.12"

      - name: Check the Tag Names This Version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is on a commit whose version is ${version}."
            exit 1
          fi

      - name: Build Sdist and Wheel
        run: uv build

      - name: Leave Out Files PyPI Already Has
        id: upload
        run: |
          set -euo pipefail
          # PyPI refuses a file name it has seen, even with new content, and a
          # rebuilt sdist rarely matches the uploaded one byte for byte. So only
          # what PyPI lacks is uploaded: everything for a new version, the rest
          # after a release that stopped partway, and nothing on a rerun.
          version="${GITHUB_REF_NAME#v}"
          status=$(curl --silent --output pypi.json --write-out '%{http_code}' --retry 3 \
            "https://pypi.org/pypi/veridelta/${version}/json")
          case "$status" in
            200) ;;
            404) echo '{"urls": []}' > pypi.json ;;
            *) echo "::error::PyPI answered HTTP ${status} for ${version}."; exit 1 ;;
          esac
          for name in $(python3 -c 'import json; print(" ".join(u["filename"] for u in json.load(open("pypi.json"))["urls"]))'); do
            if [ -e "dist/${name}" ]; then
              echo "PyPI already has ${name}."
              rm "dist/${name}"
            fi
          done
          left=$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')
          echo "files=${left}" >> "$GITHUB_OUTPUT"
          if [ "$left" -eq 0 ]; then
            echo "::notice::PyPI already has every file of ${version}, so there is nothing to upload."
          fi

      - name: Keep the Files to Publish
        if: steps.upload.outputs.files != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          # A rerun of every job builds again and replaces what an earlier attempt kept.
          overwrite: true

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.files != '0'
    runs-on: ubuntu-latest

    # The only job that can publish. It checks out nothing and runs no build,
    # so the code of the release, its build backend, and its dependencies
    # never run where the PyPI token can be minted.
    environment:
      name: pypi
      url: https://pypi.org/project/veridelta/

    permissions:
      id-token: write

    steps:
      - name: Download the Files to Publish
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Signs each file with the run's identity, which PyPI shows beside it.
          attestations: true
          # Skips anything uploaded since the build job checked, instead of failing on it.
          skip-existing: true

  github-release:
    name: Create the GitHub Release
    needs: [build, publish]
    # Also when publish is skipped, because PyPI already has every file.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create the Release with Generated Notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Latest goes to the highest full version tag only, so a rerun on an
          # older tag cannot take it from a newer release.
          newest=$(gh api "repos/${GH_REPO}/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
            | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=false
          if [ "$TAG" = "$newest" ]; then
            latest=true
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "${TAG} already has a release."
            if [ "$latest" = true ]; then
              gh release edit "$TAG" --latest
            fi
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --latest="$latest"
          fi
