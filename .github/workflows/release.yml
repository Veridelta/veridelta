name: Publish to PyPI

on:
  push:
    tags:
      # Only a full version tag (e.g., v0.10.0) publishes. GitHub's filter
      # treats `+` as "one or more", so a floating action tag such as `v1`
      # cannot trigger a release by matching a looser `v*`.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-publish:
    name: Build and Publish Artifacts
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org/project/veridelta/
      
    permissions:
      id-token: write 
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Build Sdist and Wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish