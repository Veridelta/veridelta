[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veridelta"
version = "0.33.0"
description = "Compare two datasets on their primary keys under rules you declare, on a laptop, in CI, or inside a warehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "The Veridelta Contributors", email = "veridelta.labs@gmail.com" },
]
keywords = [
    "data-comparison",
    "data-diff",
    "data-migration",
    "data-engineering",
    "polars",
    "duckdb",
    "snowflake",
    "bigquery",
    "databricks",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.39.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    # The output schemas need its `TypedDict` on Python 3.11. Pydantic requires it too.
    "typing-extensions>=4.14.1",
]

[project.urls]
Homepage = "https://veridelta.github.io/veridelta/"
Repository = "https://github.com/Veridelta/veridelta"
Issues = "https://github.com/Veridelta/veridelta/issues"

[project.optional-dependencies]
snowflake = [
    # 4.7.3 is the first release with no known advisory: earlier ones log
    # credentials (CVE-2024-49750) or skip the TLS hostname check
    # (CVE-2026-15925), among others.
    "snowflake-connector-python>=4.7.3",
    # 23.0.1 is the first release with no known advisory: earlier ones run code
    # from a crafted IPC file (CVE-2023-47248) or free memory in use while
    # reading one (CVE-2026-25087).
    "pyarrow>=23.0.1; python_version < '3.14'",
    # The driver warns on any pyarrow outside this range once running on 3.14.
    "pyarrow>=23.0.1,<24; python_version >= '3.14'",
]
databricks = [
    "databricks-sql-connector>=3.0.0",
    "pyarrow>=23.0.1",
]
delta = ["deltalake>=0.15.0"]
iceberg = ["pyiceberg>=0.6.0"]
excel = ["fastexcel>=0.11.0"]
# 3.0.0 settled the `score_cutoff` behavior the fuzzy rules rely on.
fuzzy = ["rapidfuzz>=3.0.0"]
database = [
    # ConnectorX ships wheels only, and 0.4.5 is the first with Python 3.14
    # wheels. It declares no dependencies, but Polars reads its results
    # through pyarrow, so the extra names pyarrow itself.
    "connectorx>=0.4.5",
    "pyarrow>=23.0.1",
]
# 1.5.0 is the release the parity suite runs on, and DuckDB's Polars export
# reads its results through pyarrow.
duckdb = [
    "duckdb>=1.5.0",
    "pyarrow>=23.0.1",
]
bigquery = [
    # 3.11.0 is the first release with every API the connector uses:
    # `RowIterator.to_arrow_iterable`, and `Client(location=...)` through
    # `from_service_account_json`. pyarrow is only an extra of the client.
    "google-cloud-bigquery>=3.11.0",
    "pyarrow>=23.0.1",
]
# The server is written against the SDK's 2.x API, which renamed the server
# class and moved its transport settings, and is tested on 2.3.0.
mcp = ["mcp>=2.3.0,<3"]
all = [
    "veridelta[snowflake]",
    "veridelta[databricks]",
    "veridelta[bigquery]",
    "veridelta[delta]",
    "veridelta[iceberg]",
    "veridelta[excel]",
    "veridelta[fuzzy]",
    "veridelta[database]",
    "veridelta[duckdb]",
    "veridelta[mcp]",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.10",
    "duckdb>=1.5.0",
    "hypothesis>=6.140.0",
    "ipykernel>=7.2.0",
    "jsonschema>=4.26.0",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.3",
    "mypy>=1.20.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "opentelemetry-proto>=1.45.0",
    "pre-commit>=4.5.1",
    "psycopg[binary]>=3.2",
    "pyright>=1.1.414",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.10",
    # The SQL catalog the Iceberg tests write real tables through.
    "sqlalchemy>=2.0.18",
    "types-pyyaml>=6.0.12.20260408",
    "xlsxwriter>=3.2.0",
]
# Drivers that load test tables into live MySQL and SQL Server servers. Only
# `make databases` and the Database Servers CI job install them.
databases = [
    # 1.1.1 fixes CVE-2024-36039. The rsa extra signs in to MySQL 8's default
    # caching_sha2_password over a connection without TLS.
    "pymysql[rsa]>=1.1.1",
    # 2.3.8 is the first release with wheels for Python 3.11 to 3.14.
    "pymssql>=2.3.8",
]
# Drives Chromium for the accessibility checks. Only `make accessibility` and the
# Accessibility CI job install it.
accessibility = [
    "playwright>=1.56.0",
]

[project.scripts]
veridelta = "veridelta.cli:main"

[tool.hatch.build.targets.sdist]
# The recordings and screenshots serve the docs site, which builds from the
# repository. They would make up about half of the source archive.
exclude = ["docs/assets/*.gif", "docs/assets/*.png"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "hooks"]
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
disable_error_code = ["prop-decorator"]
# nbformat ships no annotations, and the notebook tests only read files with it.
untyped_calls_exclude = ["nbformat"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disable_error_code = ["untyped-decorator"]
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "polars.*",
    "yaml.*",
    "pytest.*",
    "pytest_mock",
    "pytest_mock.*",
    "duckdb",
    "duckdb.*",
    "hypothesis",
    "hypothesis.*",
    "nbformat",
    "nbformat.*",
    "nbclient",
    "nbclient.*",
    "jsonschema",
    "jsonschema.*",
    "mcp",
    "mcp.*",
    "anyio",
    "anyio.*",
    "psycopg",
    "psycopg.*",
    "pymysql",
    "pymysql.*",
    "pymssql",
    "pymssql.*",
    "opentelemetry",
    "opentelemetry.*",
    "google.protobuf",
    "google.protobuf.*",
    "mkdocs",
    "mkdocs.*",
    "playwright",
    "playwright.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "snowflake",
    "snowflake.*",
    "databricks",
    "databricks.*",
    "numpy",
    "numpy.*",
    "pyarrow",
    "pyarrow.*",
    "pandas",
    "pandas.*",
    "deltalake",
    "deltalake.*",
    "pyiceberg",
    "pyiceberg.*",
    "connectorx",
    "connectorx.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "TCH",
    "N",
    "PT",
    "D",
    "PERF",
    "RUF",
    "ARG",
    "C90",
]

ignore = ["E501", "D104"]

[tool.ruff.lint.mccabe]
# Complexity budget per function. Split a function before suppressing C901.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = [
    "--tb=short",
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "unit: Isolated tests for individual components or functions.",
    "integration: Tests evaluating multiple internal components interacting.",
    "e2e: End-to-end tests validating the full user journey (e.g., CLI).",
    "smoke: Critical-path tests run post-deployment to ensure basic sanity.",
    "fast: CPU-bound tests that execute in milliseconds.",
    "slow: I/O bound or large-dataset tests.",
    "property: Hypothesis property tests that draw their own cases.",
    "skip_on(*backends, reason): Parity cases the named backends refuse or cannot store; the harness skips them there.",
    "only_on(*backends, reason): Parity cases that pin the named backends' own behavior; the harness skips them elsewhere.",
]

[tool.coverage.run]
source = ["src/veridelta"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.33.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/veridelta/__init__.py:__version__",
    "mkdocs.yml:version",
    "ci/gitlab/veridelta.yml:veridelta-version",
    # The pins a user copies, each selected by the text around it. A line that matches the
    # pattern and holds the current version is rewritten; `tests/unit/test_version_pins.py`
    # holds every one of them to `veridelta.__version__` between releases.
    "ci/gitlab/veridelta.yml:Veridelta/veridelta/v",
    "action.yml:Veridelta/veridelta@v",
    ".github/ISSUE_TEMPLATE/bug_report.yml:placeholder: veridelta",
    "docs/configuration.md:Veridelta/veridelta/v",
    "docs/ci.md:Veridelta/veridelta@v|uvx veridelta@|Veridelta/veridelta/v|pin `v|such as `v|\\]==",
    # Each tutorial's Colab link opens its release tag, and its first cell installs that release.
    "docs/examples/01_core_concepts.ipynb:blob/v|veridelta==",
    "docs/examples/02_yaml_and_cli.ipynb:blob/v|veridelta==",
    "docs/examples/03_advanced_rules.ipynb:blob/v|veridelta==",
    "docs/examples/04_html_reports.ipynb:blob/v|veridelta==",
    "docs/examples/05_validate_and_ci.ipynb:Veridelta/veridelta@v|Veridelta/veridelta/v|blob/v|\\]==",
    "docs/examples/06_model_evaluation_runs.ipynb:blob/v|\\]==",
]
update_changelog_on_bump = true
major_version_zero = true
