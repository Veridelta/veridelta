# ruff, mypy, and commitizen run from the project's environment, so each hook
# runs the version uv.lock pins, as `make lint` does. `--frozen` keeps a hook
# from rewriting uv.lock in the middle of a commit.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: unsupported
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy --strict
        language: unsupported
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        files: \.py$
        exclude: __pycache__
        args:
          - --license-filepath
          - .github/LICENSE_HEADER.txt
          - --use-current-year

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: uv run --frozen cz check --allow-abort --commit-msg-file
        language: unsupported
        stages: [commit-msg]
